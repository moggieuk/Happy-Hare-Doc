<text x="538.0" y="373.6" font-size="14" fill="#168a96" font-weight="700" text-anchor="end">extruder 1</text>
<rect x="811.0" y="138.0" width="18" height="448.8" fill="#e7eef4" stroke="#a5b5c4" stroke-width="1.5"/>
<rect x="784.0" y="503.2" width="72" height="83.6" rx="6" fill="#f6dfcf" stroke="#db782c" stroke-width="2" opacity=".85"/>
<path d="M806.0,586.8 L834.0,586.8 L825.0,600.0 L815.0,600.0 Z" fill="#c6d2dd" stroke="#71869a" stroke-width="2"/>
<circle cx="796.0" cy="283.2" r="14" fill="#d3dce6" stroke="#71869a" stroke-width="2"/>
<circle cx="796.0" cy="283.2" r="4" fill="#71869a"/>
<circle cx="844.0" cy="283.2" r="14" fill="#d3dce6" stroke="#71869a" stroke-width="2"/>
<circle cx="844.0" cy="283.2" r="4" fill="#71869a"/>
<rect x="831.0" y="242.0" width="12" height="12" rx="3" fill="#168a96"/>
<rect x="831.0" y="321.2" width="12" height="12" rx="3" fill="#168a96"/>
<path d="M834.0,224.0 L882.0,219.0 L882.0,231.0 L834.0,228.0 Z" fill="#8799ac" stroke="#52677d" stroke-width="1.5"/>
<rect x="815.0" y="138.0" width="10" height="88.0" rx="3" fill="#e983a9"/>
<rect x="815.0" y="349.2" width="10" height="220.0" rx="3" fill="#e983a9"/>
<path d="M864.0,349.2 h8 V569.2 h-8" fill="none" stroke="#20344b" stroke-width="1.6"/>
<text x="878.0" y="455.2" font-size="14" fill="#20344b" font-weight="700" text-anchor="start">fragment 50</text>
<text x="878.0" y="473.2" font-size="13" fill="#52677d" font-weight="400" text-anchor="start">7 to 57</text>
<text x="804.0" y="216.0" font-size="14" fill="#20344b" font-weight="700" text-anchor="end">end 85</text>
<text x="380.0" y="628.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">Tip retracted to retract_length</text>
<text x="380.0" y="646.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">(35), still gripped by the gears.</text>
<text x="380.0" y="664.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">The gear pulls back tension_length</text>
<text x="380.0" y="682.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">(10) to tension the cut.</text>
<text x="600.0" y="628.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">The blade cuts at blade_pos.</text>
<text x="600.0" y="646.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">The extruder alone pushes the</text>
<text x="600.0" y="664.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">fragment rip_length (1) off</text>
<text x="600.0" y="682.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">the blade.</text>
<text x="820.0" y="628.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">Synced pushback_length (28) and</text>
<text x="820.0" y="646.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">back: the fragment sits past the</text>
<text x="820.0" y="664.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">gears and 5mm clear of the</text>
<text x="820.0" y="682.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">toolhead sensor.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
<title id="title">Cutter before the extruder</title>
<desc id="desc">Three side views of a toolhead whose cutter blade sits 85mm above the nozzle, before the extruder gears at 72mm. First the tip is retracted to 35mm and the gear pulls the filament taut. Then the blade cuts and the extruder pushes the fragment 1mm off the blade. Finally a synced 28mm pushback and return leaves a 50mm fragment between 7mm and 57mm, past the gears and clear of the toolhead sensor at 62mm.</desc>
<defs>
<marker id="warm" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#db782c"/></marker>
<marker id="cool" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#168a96"/></marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif">

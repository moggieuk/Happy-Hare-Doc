<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
<title id="title">Cutter after the extruder gears</title>
<desc id="desc">Three side views of a toolhead whose cutter blade sits 52mm above the nozzle, between the extruder gears at 72mm and the nozzle. First the tip is retracted to 42mm. Then the blade cuts and a 1mm retract pulls the filament end off the blade. Finally a 25mm pushback and return leaves the 10mm fragment between 18mm and 28mm, deep in the hotend, with the filament end back at 53mm.</desc>
<defs>
<marker id="warm" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#db782c"/></marker>
<marker id="cool" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#168a96"/></marker>
</defs>

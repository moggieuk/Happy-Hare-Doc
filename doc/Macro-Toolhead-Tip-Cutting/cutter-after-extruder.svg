<text x="32.0" y="68.0" font-size="17" fill="#52677d" font-weight="400" text-anchor="start">Example · heights in mm above the internal nozzle tip, drawn to scale</text>
<line x1="250" y1="371.2" x2="1008" y2="371.2" stroke="#9babbb" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="240.0" y="376.2" font-size="15" fill="#20344b" font-weight="700" text-anchor="end">blade_pos 52</text>
<line x1="250" y1="248.0" x2="1008" y2="248.0" stroke="#9babbb" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="240.0" y="253.0" font-size="15" fill="#20344b" font-weight="700" text-anchor="end">extruder sensor 80</text>
<line x1="250" y1="283.2" x2="1008" y2="283.2" stroke="#9babbb" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="240.0" y="280.2" font-size="15" fill="#20344b" font-weight="700" text-anchor="end">extruder gears 72</text>
<text x="240.0" y="298.2" font-size="13" fill="#52677d" font-weight="400" text-anchor="end">toolhead_extruder_to_nozzle</text>
<line x1="250" y1="327.2" x2="1008" y2="327.2" stroke="#9babbb" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="240.0" y="324.2" font-size="15" fill="#20344b" font-weight="700" text-anchor="end">toolhead sensor 62</text>
<text x="240.0" y="342.2" font-size="13" fill="#52677d" font-weight="400" text-anchor="end">toolhead_sensor_to_nozzle</text>
<line x1="250" y1="600.0" x2="1008" y2="600.0" stroke="#9babbb" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="240.0" y="605.0" font-size="15" fill="#20344b" font-weight="700" text-anchor="end">nozzle tip 0</text>
<text x="380.0" y="112.0" font-size="17" fill="#20344b" font-weight="700" text-anchor="middle">1  Retract</text>
<text x="600.0" y="112.0" font-size="17" fill="#20344b" font-weight="700" text-anchor="middle">2  Cut and rip</text>
<text x="820.0" y="112.0" font-size="17" fill="#20344b" font-weight="700" text-anchor="middle">3  Pushback and return</text>
<rect x="371.0" y="138.0" width="18" height="448.8" fill="#e7eef4" stroke="#a5b5c4" stroke-width="1.5"/>
<rect x="344.0" y="503.2" width="72" height="83.6" rx="6" fill="#f6dfcf" stroke="#db782c" stroke-width="2" opacity=".85"/>

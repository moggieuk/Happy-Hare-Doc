<rect x="831.0" y="321.2" width="12" height="12" rx="3" fill="#168a96"/>
<path d="M834.0,369.2 L882.0,364.2 L882.0,376.2 L834.0,373.2 Z" fill="#8799ac" stroke="#52677d" stroke-width="1.5"/>

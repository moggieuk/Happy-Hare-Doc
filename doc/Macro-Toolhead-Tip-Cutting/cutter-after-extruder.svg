<text x="820.0" y="646.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">fragment down into the hotend and</text>
<text x="820.0" y="664.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">the filament end returns.</text>
<text x="820.0" y="682.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle"></text>

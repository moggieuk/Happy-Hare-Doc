<path d="M864.0,476.8 h8 V520.8 h-8" fill="none" stroke="#20344b" stroke-width="1.6"/>
<text x="878.0" y="494.8" font-size="14" fill="#20344b" font-weight="700" text-anchor="start">fragment 10</text>
<text x="878.0" y="512.8" font-size="13" fill="#52677d" font-weight="400" text-anchor="start">18 to 28</text>
<text x="804.0" y="356.8" font-size="14" fill="#20344b" font-weight="700" text-anchor="end">end 53</text>
<text x="380.0" y="628.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">Tip retracted to retract_length</text>
<text x="380.0" y="646.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">(42), out of the melt zone.</text>
<text x="380.0" y="664.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle"></text>
<text x="380.0" y="682.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle"></text>
<text x="600.0" y="628.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">The blade cuts at blade_pos and</text>
<text x="600.0" y="646.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">rip_length (1) retracts the</text>
<text x="600.0" y="664.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle">filament end off the blade.</text>
<text x="600.0" y="682.0" font-size="14" fill="#52677d" font-weight="400" text-anchor="middle"></text>

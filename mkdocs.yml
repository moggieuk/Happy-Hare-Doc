# Built with Zensical (https://zensical.org), not mkdocs - this file keeps the
# mkdocs.yml name/format because Zensical reads it natively ("your current
# settings just work"); see doc_tools/README.md for the reasoning. TOC.md, the
# internal planning doc for this rewrite, lives at the repo root rather than
# under docs_dir so it's never a candidate for publishing in the first place.
site_name: Happy Hare v4
site_description: Universal Automated Filament Changer / MMU driver for Klipper
repo_url: https://github.com/moggieuk/Happy-Hare
docs_dir: doc
copyright: Copyright (C) 2022-2026 Paul Morgan

theme:
  name: material
  variant: classic
  logo: assets/images/doc_logo2.png
  favicon: assets/images/favicon.png
  # Pink is the brand's own color, not a pick from Material's swatch list for its
  # own sake: HH's warning text is #FF69B4 (see test/README.md, "why a warning
  # shows up on a pink background") and the wiki/README logo is that same hot pink
  # rendered as a neon sign. Black keeps the header/nav that neon-over-brick dark
  # in both light and dark reading modes, rather than flipping to white in light mode.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - search.suggest
extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/hh-page-nav.js
  # Mermaid, loaded and driven ourselves (hh-mermaid.js) rather than through
  # pymdownx.superfences' custom-fence recipe - see hh-mermaid.js's own header
  # comment and TOC.md's "Zensical rough edges" for why that path is flaky.
  # Pinned to an exact release, not a floating major tag: every other asset on
  # this site is local, and a silent CDN-side 10.x patch bump would change
  # rendering behavior with no commit here. mermaid.min.js is the UMD build,
  # which attaches a synchronous global `mermaid` - the .mjs/ESM build would
  # need type="module" and a different loading order.
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js
  - assets/javascripts/hh-mermaid.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/moggieuk/Happy-Hare
      name: Happy Hare on GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/98TYYUf6f2
      name: Happy Hare on Discord
    - icon: material/tablet-dashboard
      link: https://github.com/moggieuk/KlipperScreen-Happy-Hare-Edition
      name: KlipperScreen Happy Hare Edition on GitHub

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - codehilite
  - admonition
  - pymdownx.tabbed
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      css_class: codehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  # SuperFences is the sole backtick-fence processor; do not also enable Python-
  # Markdown's fenced_code, because both register the same internal processor name
  # and SuperFences explicitly does not support loading them together. SuperFences
  # is required for fences nested in admonitions, lists, and tabs. Its wrapper is
  # pinned to codehilite so existing theme CSS remains valid; the codehilite
  # extension above continues to handle traditional indented/:::lang blocks.
  #
  # This does not enable a SuperFences Mermaid custom fence. Mermaid remains raw
  # HTML driven by hh-mermaid.js because that custom-fence route was historically
  # non-deterministic in Zensical; see TOC.md's "Zensical rough edges" section.

